name: Deploy su GitHub Pages

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta: un push nuovo sostituisce quello ancora in corso.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      # Il sito vive in /cyber-cadungeon/, quindi la pagina deve saperlo (base href).
      - run: npx ng build --base-href /cyber-cadungeon/
      # Pages non conosce le rotte dell'app (/lobby/ABCD…): ogni indirizzo sconosciuto riceve la pagina principale.
      - run: cp dist/cyber-cadungeon/browser/index.html dist/cyber-cadungeon/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cyber-cadungeon/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
